<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habit Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <h1>Habit Tracker</h1>
    <div class="header-stats">
      <span class="trophy-badge">&#127942; <strong id="totalCompletionsValue">0</strong></span>
    </div>
  </header>

  <div class="window-nav">
    <button type="button" id="prevWindowBtn" class="btn small ghost" title="Earlier">&#8249;</button>
    <span class="window-label" id="windowLabel"></span>
    <button type="button" id="nextWindowBtn" class="btn small ghost" title="Later">&#8250;</button>
  </div>

  <main>
    <div class="grid-scroll">
      <div id="habitGrid" class="habit-grid"></div>
    </div>
    <p class="hint hidden" id="emptyHint">No habits yet. Add one below to get started.</p>
  </main>
</div>

<template id="dayCellTemplate">
  <button type="button" class="day-cell"></button>
</template>

<script src="script.js"></script>
</body>
</html>
